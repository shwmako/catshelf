<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Evita el bloqueo de portadas de MangaDex por Referrer -->
    <meta name="referrer" content="no-referrer">
    <title>Tracker de Manhwas 🌸</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #f4f4f5; padding: 25px; text-align: center; }
        h1 { color: #c4b5fd; margin-bottom: 5px; }
        p { color: #a1a1aa; font-size: 0.95rem; }
        input { padding: 14px 18px; border-radius: 10px; border: 1px solid #3f3f46; background: #18181b; color: #fff; width: 80%; max-width: 420px; margin: 20px 0; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        #resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 25px; }
        .card { background: #18181b; padding: 12px; border-radius: 12px; border: 1px solid #27272a; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #8b5cf6; }
        .card img { width: 100%; height: 230px; object-fit: cover; border-radius: 8px; }
        .card h3 { font-size: 0.9rem; margin: 12px 0 6px; color: #f4f4f5; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .status { font-size: 0.75rem; color: #a1a1aa; text-transform: uppercase; }
    </style>
</head>
<body>

    <h1>Tracker de Manhwas 🌸</h1>
    <p>Escribe el nombre del manhwa y presiona Enter</p>
    
    <input type="text" id="busqueda" placeholder="Ej: Checkmate, Lost in the cloud...">
    
    <div id="loader" style="display: none; color: #c4b5fd;">Buscando en MangaDex... 🕒</div>
    <div id="resultados"></div>

    <script>
        const inputBusqueda = document.getElementById('busqueda');
        const loader = document.getElementById('loader');
        const resultadosDiv = document.getElementById('resultados');

        async function buscarManhwa(titulo) {
            resultadosDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                // Si estás en Vercel usa la API Serverless, si estás en local usa MangaDex directo
                const esLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
                const endpoint = esLocal 
                    ? `https://api.mangadex.org/manga?title=${encodeURIComponent(titulo)}&limit=10&includes[]=cover_art`
                    : `/api/buscar?titulo=${encodeURIComponent(titulo)}`;

                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

                const data = await response.json();
                loader.style.display = 'none';

                if (data.data && data.data.length > 0) {
                    data.data.forEach(manga => {
                        const titleObj = manga.attributes.title || {};
                        const tituloMostrar = titleObj.en || titleObj['ja-ro'] || titleObj.es || Object.values(titleObj)[0] || 'Sin título';

                        let coverUrl = 'https://via.placeholder.com/150x220?text=Sin+Portada';
                        
                        const coverRel = manga.relationships.find(rel => rel.type === 'cover_art');
                        if (coverRel && coverRel.attributes && coverRel.attributes.fileName) {
                            const fileName = coverRel.attributes.fileName;
                            coverUrl = `https://uploads.mangadex.org/covers/${manga.id}/${fileName}.256.jpg`;
                        }

                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${coverUrl}" alt="${tituloMostrar}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x220?text=Sin+Portada'">
                            <h3 title="${tituloMostrar}">${tituloMostrar}</h3>
                            <span class="status">${manga.attributes.status || 'Desconocido'}</span>
                        `;
                        resultadosDiv.appendChild(card);
                    });
                } else {
                    resultadosDiv.innerHTML = '<p>No se encontraron resultados en MangaDex. 😒</p>';
                }

            } catch (error) {
                loader.style.display = 'none';
                console.error(error);
                resultadosDiv.innerHTML = '<p style="color: #ef4444;">Error al conectar con la API.</p>';
            }
        }

        inputBusqueda.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                buscarManhwa(this.value.trim());
            }
        });
    </script>
</body>
</html>
